<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se | Doce Encanto</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat v9) & Sincronização em Nuvem -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar" aria-label="Navegação principal">
        <a href="inicio.html" class="nav-link">Início</a>
        <a href="cardapio.html" class="nav-link">Cardápio</a>
        <a href="sobrenos.html" class="nav-link">Sobre Nós</a>
        <a href="encomendas.html" class="nav-link">Encomendas</a>
        <a href="contato.html" class="nav-link">Contato</a>
        <a href="login.html" class="nav-link" id="user-nav-link"><i class="fa-regular fa-user"></i> Login</a>
        <a href="cardapio.html" class="nav-link-carrinho"><i class="fa-solid fa-cart-shopping"></i> Carrinho</a>
    </nav>

    <main class="login-page cadastro-page">
        <section class="login-card" aria-labelledby="titulo-cadastro">
            <a class="brand" href="inicio.html" aria-label="Voltar para a página inicial">Doce Encanto</a>
            <p class="brand-subtitle">CONFEITARIA GOURMET</p>

            <div class="login-heading">
                <span class="heading-icon"><i class="fa-solid fa-cake-candles"></i></span>
                <h1 id="titulo-cadastro">Crie sua conta</h1>
                <p>Cadastre-se e aproveite uma experiência ainda mais doce.</p>
            </div>

            <!-- Mensagem de Feedback -->
            <div id="mensagem-alerta" class="alerta-box" style="display: none;"></div>

            <form id="cadastro-form" action="#" method="post">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input id="nome" type="text" name="nome" placeholder="Como podemos te chamar?" autocomplete="name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="telefone">WhatsApp / Celular</label>
                    <div class="input-wrapper">
                        <i class="fa-brands fa-whatsapp"></i>
                        <input id="telefone" type="tel" name="telefone" placeholder="(41) 99999-9999" autocomplete="tel" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input id="senha" type="password" name="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required>
                    </div>
                    <small class="input-help">Use pelo menos 6 caracteres.</small>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input id="confirmar-senha" type="password" name="confirmar-senha" placeholder="Repita sua senha" autocomplete="new-password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn-entrar">Criar minha conta <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="register-link">Já possui uma conta? <a href="login.html">Faça login</a></p>
            <a class="back-link" href="inicio.html"><i class="fa-solid fa-arrow-left"></i> Voltar para o início</a>
        </section>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const cadastroForm = document.getElementById('cadastro-form');
        const alertaBox = document.getElementById('mensagem-alerta');
        const telefoneInput = document.getElementById('telefone');

        // Máscara dinâmica para WhatsApp/Telefone: (XX) XXXXX-XXXX ou (XX) XXXX-XXXX
        if (telefoneInput) {
            telefoneInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) {
                    v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                } else if (v.length > 6) {
                    v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
                } else if (v.length > 2) {
                    v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
                } else if (v.length > 0) {
                    v = v.replace(/^(\d*)/, '($1');
                }
                e.target.value = v;
            });
        }

        // Lê parâmetros de retorno (se veio do carrinho ou checkout)
        const urlParams = new URLSearchParams(window.location.search);
        const retornoUrl = urlParams.get('retorno') || sessionStorage.getItem('urlRetornoCompra') || '';
        if (retornoUrl) {
            sessionStorage.setItem('urlRetornoCompra', retornoUrl);
            const loginLink = document.querySelector('.register-link a');
            if (loginLink) {
                loginLink.href = 'login.html?retorno=' + encodeURIComponent(retornoUrl);
            }
        }

        // Função para mostrar alertas visuais na tela
        function exibirMensagem(texto, tipo = 'erro') {
            alertaBox.style.display = 'block';
            alertaBox.style.padding = '12px';
            alertaBox.style.marginBottom = '15px';
            alertaBox.style.borderRadius = '8px';
            alertaBox.style.textAlign = 'center';
            alertaBox.style.fontSize = '0.9rem';

            if (tipo === 'erro') {
                alertaBox.style.backgroundColor = '#e74c3c';
                alertaBox.style.color = '#fff';
            } else {
                alertaBox.style.backgroundColor = '#2ecc71';
                alertaBox.style.color = '#fff';
            }
            alertaBox.textContent = texto;
        }

        if (cadastroForm) {
            cadastroForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const telefone = telefoneInput ? telefoneInput.value.trim() : '';
                const senha = document.getElementById('senha').value;
                const confirmarSenha = document.getElementById('confirmar-senha').value;

                // 1. Validações completas
                if (nome.length < 2) {
                    exibirMensagem('Por favor, informe seu nome completo.');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    exibirMensagem('Por favor, informe um endereço de e-mail válido.');
                    return;
                }

                const telLimpo = telefone.replace(/\D/g, '');
                if (telLimpo.length < 10) {
                    exibirMensagem('Por favor, informe um telefone/WhatsApp válido com DDD.');
                    return;
                }

                if (senha.length < 6) {
                    exibirMensagem('A senha deve ter no mínimo 6 caracteres.');
                    return;
                }

                if (senha !== confirmarSenha) {
                    exibirMensagem('As senhas não coincidem!');
                    return;
                }

                // 2. Verificar se o e-mail já existe
                const usuariosSalvos = window.DoceEncantoDB ? window.DoceEncantoDB.obterUsuarios() : (JSON.parse(localStorage.getItem('usuariosDoceEncanto')) || []);
                const usuarioExiste = usuariosSalvos.some(u => u.email.toLowerCase() === email);
                if (usuarioExiste || email === 'admin@doceencanto.com') {
                    exibirMensagem('Este e-mail já está cadastrado! Faça login ou use outro e-mail.');
                    return;
                }

                // 3. Salvar o novo usuário com estrutura completa e R$ 5 de cashback de boas-vindas
                const novoUsuario = {
                    id: Date.now(),
                    nome: nome,
                    email: email,
                    telefone: telefone,
                    senha: senha,
                    role: 'cliente',
                    saldoCashback: 5.00,
                    cep: '',
                    endereco: '',
                    numero: '',
                    complemento: '',
                    bairro: '',
                    cidade: 'Curitiba',
                    criadoEm: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                };

                if (window.DoceEncantoDB) {
                    window.DoceEncantoDB.salvarUsuario(novoUsuario);
                    window.DoceEncantoDB.fazerLogin(novoUsuario);
                } else {
                    usuariosSalvos.push(novoUsuario);
                    localStorage.setItem('usuariosDoceEncanto', JSON.stringify(usuariosSalvos));
                    localStorage.setItem('usuarioLogadoDoceEncanto', JSON.stringify(novoUsuario));
                }

                // 4. Exibir mensagem de sucesso e redirecionar imediatamente conectado
                exibirMensagem('Conta criada com sucesso! Bônus de R$ 5,00 creditado. Conectando...', 'sucesso');

                setTimeout(() => {
                    const destino = retornoUrl || 'inicio.html';
                    sessionStorage.removeItem('urlRetornoCompra');
                    
                    // Se o destino for uma página de compra, anexa ?checkout=abrir para abrir direto
                    if (destino.includes('cardapio.html') || destino.includes('inicio.html') || destino.includes('encomendas.html') || destino.includes('sobrenos.html')) {
                        const separador = destino.includes('?') ? '&' : '?';
                        window.location.href = destino.replace(/[?&]checkout=[^&]*/g, '') + separador + 'checkout=abrir';
                    } else {
                        window.location.href = destino;
                    }
                }, 1200);
            });
        }
    });
    </script>
</body>
</html>
