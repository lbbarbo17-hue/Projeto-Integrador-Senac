<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Doce Encanto Confeitaria</title>

    <!-- Estilos do Projeto -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bio.css">

    <!-- Fontes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <main class="bio-container">
        
        <!-- PERFIL / CABEÇALHO -->
        <header class="bio-profile">
            <div class="bio-avatar-box">
                <img src="imagens_inicio/Confeitaria.jpg" alt="Doce Encanto" class="bio-avatar">
            </div>
            <h1 class="bio-title">Doce Encanto</h1>
            <span class="bio-subtitle">CONFEITARIA GOURMET</span>
            <p class="bio-description">
                ✨ A doçura que transforma o seu dia.<br>
                📍 Curitiba e Região Metropolitana - PR
            </p>
        </header>

        <!-- LISTA DE LINKS / BOTÕES DA BIO -->
        <div class="bio-links">
            
            <!-- Link 1: WhatsApp / Delivery -->
            <a href="index.html" class="bio-link-btn highlight">
                <i class="fa-solid fa-utensils icon-left"></i>
                <span>Peça pelo Delivery / Cardápio</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Link 2: Encomendas Especiais -->
            <a href="encomendas.html" class="bio-link-btn">
                <i class="fa-solid fa-cake-candles icon-left"></i>
                <span>Encomendas & Kits Festa</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Link 3: Falar no WhatsApp -->
            <a href="https://wa.me/5511949010900?text=Olá!%20Vim%20pelo%20link%20da%20bio." target="_blank" class="bio-link-btn">
                <i class="fa-brands fa-whatsapp icon-left"></i>
                <span>Atendimento via WhatsApp</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Link 4: Sobre Nós -->
            <a href="sobrenos.html" class="bio-link-btn">
                <i class="fa-solid fa-heart icon-left"></i>
                <span>Conheça Nossa História</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Link 5: Lojas Físicas / Contato -->
            <a href="contato.html" class="bio-link-btn">
                <i class="fa-solid fa-location-dot icon-left"></i>
                <span>Lojas Físicas & Horários</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

        </div>

        <!-- REDES SOCIAIS NO RODAPÉ DA BIO -->
        <footer class="bio-socials">
            <a href="#" class="bio-social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="bio-social-icon" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="bio-social-icon" title="iFood / Delivery"><i class="fa-solid fa-burger"></i></a>
        </footer>

        <p class="bio-footer-copy">© 2026 Doce Encanto Confeitaria</p>

    </main>

</body>
</html>
