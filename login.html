<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Doce Encanto</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat v9) & Sincronização em Nuvem -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar" aria-label="Navegação principal">
        <a href="inicio.html" class="nav-link">Início</a>
        <a href="cardapio.html" class="nav-link">Cardápio</a>
        <a href="sobrenos.html" class="nav-link">Sobre Nós</a>
        <a href="encomendas.html" class="nav-link">Encomendas</a>
        <a href="contato.html" class="nav-link">Contato</a>
        <a href="login.html" class="nav-link active" id="user-nav-link"><i class="fa-regular fa-user"></i> Login</a>
        <a href="cardapio.html" class="nav-link-carrinho"><i class="fa-solid fa-cart-shopping"></i> Carrinho</a>
    </nav>

    <main class="login-page">
        <section class="login-card" aria-labelledby="titulo-login">
            <a class="brand" href="inicio.html" aria-label="Voltar para a página inicial">Doce Encanto</a>
            <p class="brand-subtitle">CONFEITARIA GOURMET</p>

            <div class="login-heading">
                <span class="heading-icon"><i class="fa-solid fa-heart"></i></span>
                <h1 id="titulo-login">Que bom ter você de volta!</h1>
                <p>Entre para deixar seus momentos ainda mais doces.</p>
            </div>

            <!-- Mensagem de Feedback -->
            <div id="mensagem-alerta" class="alerta-box" style="display: none;"></div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input id="senha" type="password" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="esqueceusenha.html" style="color: #888; font-size: 0.85rem; text-decoration: none;">Esqueceu a senha?</a>
                    </div>
                </div>

                <button type="submit" class="btn-entrar">Entrar <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="register-link">Ainda não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            <a class="back-link" href="inicio.html"><i class="fa-solid fa-arrow-left"></i> Voltar para o início</a>
        </section>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('login-form');
        const alertaBox = document.getElementById('mensagem-alerta');

        // Lê parâmetros de retorno (se veio de uma compra ou checkout)
        const urlParams = new URLSearchParams(window.location.search);
        const retornoUrl = urlParams.get('retorno') || sessionStorage.getItem('urlRetornoCompra') || '';
        if (retornoUrl) {
            sessionStorage.setItem('urlRetornoCompra', retornoUrl);
            const cadLink = document.querySelector('.register-link a');
            if (cadLink) {
                cadLink.href = 'cadastro.html?retorno=' + encodeURIComponent(retornoUrl);
            }
        }

        // Função para exibir alertas diretamente na tela
        function exibirMensagem(texto, tipo = 'erro') {
            alertaBox.style.display = 'block';
            alertaBox.style.padding = '12px';
            alertaBox.style.marginBottom = '15px';
            alertaBox.style.borderRadius = '8px';
            alertaBox.style.textAlign = 'center';
            alertaBox.style.fontSize = '0.9rem';

            if (tipo === 'erro') {
                alertaBox.style.backgroundColor = '#e74c3c';
                alertaBox.style.color = '#fff';
            } else {
                alertaBox.style.backgroundColor = '#2ecc71';
                alertaBox.style.color = '#fff';
            }
            alertaBox.textContent = texto;
        }

        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value;

                let usuarioLogado = null;

                if (window.DoceEncantoDB && typeof window.DoceEncantoDB.autenticar === 'function') {
                    usuarioLogado = window.DoceEncantoDB.autenticar(email, senha);
                } else {
                    const usuariosSalvos = JSON.parse(localStorage.getItem('usuariosDoceEncanto')) || [];
                    const usuarioEncontrado = usuariosSalvos.find(u => u.email.toLowerCase() === email.toLowerCase() && u.senha === senha);
                    const eAdmin = (email.toLowerCase() === 'admin@doceencanto.com' && senha === '123456') || (usuarioEncontrado && usuarioEncontrado.role === 'admin');

                    if (usuarioEncontrado || eAdmin) {
                        usuarioLogado = usuarioEncontrado || {
                            id: 1,
                            nome: 'Administrador Geral',
                            email: 'admin@doceencanto.com',
                            role: 'admin',
                            telefone: '(41) 99999-9999'
                        };
                        localStorage.setItem('usuarioLogadoDoceEncanto', JSON.stringify(usuarioLogado));
                    }
                }

                if (usuarioLogado) {
                    exibirMensagem(`Bem-vindo(a) de volta, ${usuarioLogado.nome ? usuarioLogado.nome.split(' ')[0] : ''}! Conectando...`, 'sucesso');

                    const eAdmin = (usuarioLogado.role === 'admin' || usuarioLogado.email.toLowerCase() === 'admin@doceencanto.com');

                    setTimeout(() => {
                        if (eAdmin) {
                            window.location.href = 'admin.html';
                        } else {
                            const destino = retornoUrl || 'inicio.html';
                            sessionStorage.removeItem('urlRetornoCompra');
                            if (destino.includes('cardapio.html') || destino.includes('inicio.html') || destino.includes('encomendas.html') || destino.includes('sobrenos.html')) {
                                const separador = destino.includes('?') ? '&' : '?';
                                window.location.href = destino.replace(/[?&]checkout=[^&]*/g, '') + separador + 'checkout=abrir';
                            } else {
                                window.location.href = destino;
                            }
                        }
                    }, 1100);
                } else {
                    exibirMensagem('E-mail ou senha incorretos.');
                }
            });
        }
    });
    </script>
</body>
</html>
